databases:
  - name: regenfeed-db
    plan: free
    databaseName: regenfeed
    user: regenfeed
services:
  - type: web
    name: regenfeed-api
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: cd backend && go build -o bin/regenfeed ./cmd/app && go build -o bin/migrate ./cmd/migrate
    startCommand: cd backend && ./bin/migrate && ./bin/regenfeed
    healthCheckPath: /api/listings/summary/
    envVars:
      - key: GO_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: regenfeed-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BLINK_API_URL
        value: https://api.blink.sv/graphql
      - key: BLINK_API_KEY
        sync: false
      - key: BLINK_WALLET_ID
        sync: false
      - key: BLINK_PLATFORM_WALLET_ADDRESS
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_C2B_SHORTCODE
        sync: false
      - key: MPESA_C2B_CONFIRMATION_URL
        sync: false
      - key: MPESA_C2B_VALIDATION_URL
        sync: false
      - key: MPESA_B2C_SHORTCODE
        sync: false
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_B2C_RESULT_URL
        sync: false
      - key: MPESA_B2C_TIMEOUT_URL
        sync: false
  - type: web
    name: regenfeed-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PUBLIC_API_BASE_URL
        sync: false
